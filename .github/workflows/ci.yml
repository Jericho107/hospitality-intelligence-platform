name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: hospitality-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOSPITALITY_DB_HOST: localhost
  HOSPITALITY_DB_PORT: "5432"
  HOSPITALITY_DB_NAME: hospitality_intelligence
  HOSPITALITY_DB_USER: hospitality
  HOSPITALITY_DB_PASSWORD: local_only

jobs:
  validate-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hospitality
          POSTGRES_PASSWORD: local_only
          POSTGRES_DB: hospitality_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospitality -d hospitality_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      - name: Generate seeded source system
        run: |
          python -m hospitality_intelligence.generate_synthetic_data             --output-dir data/sample             --days 60             --seed 42             --anchor 2026-09-01T00:00:00+00:00             --scenario margin_leakage

      - name: Validate clean source contracts
        run: >-
          python -m hospitality_intelligence.validate_sources
          --data-dir data/sample

      - name: Inject controlled source mismatch
        run: >-
          python -m hospitality_intelligence.failure_injection
          --data-dir data/sample
          --case pos_revenue_mismatch

      - name: Prove source validation fails closed
        shell: bash
        run: |
          if python -m hospitality_intelligence.validate_sources --data-dir data/sample; then
            echo "Expected source validation to fail after controlled mismatch."
            exit 1
          fi
          echo "Controlled source mismatch detected."

      - name: Restore source state
        run: |
          python -m hospitality_intelligence.generate_synthetic_data             --output-dir data/sample             --days 60             --seed 42             --anchor 2026-09-01T00:00:00+00:00             --scenario margin_leakage
          python -m hospitality_intelligence.validate_sources --data-dir data/sample

      - name: Load PostgreSQL raw landing
        run: python -m hospitality_intelligence.ingest --data-dir data/sample

      - name: Prove exact source-to-raw reconciliation
        run: >-
          python -m hospitality_intelligence.reconciliation
          --data-dir data/sample

      - name: Build typed dimensional analytics store
        run: python -m hospitality_intelligence.transform

      - name: Validate all fact counts and material totals
        run: python -m hospitality_intelligence.validate_warehouse

      - name: Mutate raw target without changing source
        run: >-
          python -m hospitality_intelligence.warehouse_failure_injection
          --case raw_pos_revenue

      - name: Prove source-to-raw reconciliation catches mutation
        shell: bash
        run: |
          if python -m hospitality_intelligence.reconciliation --data-dir data/sample; then
            echo "Expected raw reconciliation to fail after target mutation."
            exit 1
          fi
          echo "Raw target mutation detected."

      - name: Restore raw landing and rebuild analytics
        run: |
          python -m hospitality_intelligence.ingest --data-dir data/sample
          python -m hospitality_intelligence.reconciliation --data-dir data/sample
          python -m hospitality_intelligence.transform
          python -m hospitality_intelligence.validate_warehouse

      - name: Mutate analytical fact without changing raw
        run: >-
          python -m hospitality_intelligence.warehouse_failure_injection
          --case fact_labour_cost

      - name: Prove warehouse validation catches fact mutation
        shell: bash
        run: |
          if python -m hospitality_intelligence.validate_warehouse; then
            echo "Expected warehouse validation to fail after fact mutation."
            exit 1
          fi
          echo "Analytical fact mutation detected."

      - name: Rebuild analytics and prove warehouse recovery
        run: |
          python -m hospitality_intelligence.transform
          python -m hospitality_intelligence.validate_warehouse

      - name: Validate KPI contracts
        run: python -m hospitality_intelligence.metric_contracts

      - name: Build governed KPI marts
        run: python -m hospitality_intelligence.build_metrics

      - name: Prove KPI marts reconcile to analytical facts
        run: python -m hospitality_intelligence.validate_metrics

      - name: Mutate materialized ADR without changing facts
        run: >-
          python -m hospitality_intelligence.metric_failure_injection
          --case rooms_adr

      - name: Prove KPI validation catches metric corruption
        shell: bash
        run: |
          if python -m hospitality_intelligence.validate_metrics; then
            echo "Expected KPI validation to fail after ADR mutation."
            exit 1
          fi
          echo "Materialized KPI corruption detected."

      - name: Rebuild KPI marts and prove final recovery
        run: |
          python -m hospitality_intelligence.build_metrics
          python -m hospitality_intelligence.validate_metrics

      - name: Generate matched diagnostic benchmark scenarios
        run: |
          python -m hospitality_intelligence.generate_synthetic_data             --output-dir data/benchmark/healthy             --days 60             --seed 42             --anchor 2026-09-01T00:00:00+00:00             --scenario healthy
          python -m hospitality_intelligence.generate_synthetic_data             --output-dir data/benchmark/leakage             --days 60             --seed 42             --anchor 2026-09-01T00:00:00+00:00             --scenario margin_leakage

      - name: Validate both benchmark source systems
        run: |
          python -m hospitality_intelligence.validate_sources --data-dir data/benchmark/healthy
          python -m hospitality_intelligence.validate_sources --data-dir data/benchmark/leakage

      - name: Prove diagnostics recover injected adverse drivers
        run: |
          python -m hospitality_intelligence.diagnostics             --baseline-dir data/benchmark/healthy             --candidate-dir data/benchmark/leakage             --require-adverse               beverage_purchase_cost_pressure               beverage_waste_pressure               fnb_overtime_pressure

      - name: Prove diagnostics do not invent adverse drivers
        run: |
          python -m hospitality_intelligence.diagnostics             --baseline-dir data/benchmark/healthy             --candidate-dir data/benchmark/healthy             --require-none

      - name: Validate Power BI semantic and report contracts
        run: python -m hospitality_intelligence.bi_contracts

      - name: Inject forbidden BI measure reference
        run: |
          python -m hospitality_intelligence.bi_failure_injection \
            --source config/report_contract.yml \
            --output /tmp/report_contract_broken.yml \
            --case unknown_measure

      - name: Prove BI contract validation fails closed
        shell: bash
        run: |
          if python -m hospitality_intelligence.bi_contracts \
            --contract /tmp/report_contract_broken.yml; then
            echo "Expected BI contract validation to fail for forbidden metric."
            exit 1
          fi
          echo "Forbidden BI measure reference detected."

      - name: Revalidate clean BI contract
        run: python -m hospitality_intelligence.bi_contracts

      - name: Validate PBIR with Microsoft authoring CLI
        run: >-
          npx --yes
          --package @microsoft/powerbi-report-authoring-cli@0.4.0
          powerbi-report-author
          validate powerbi/HospitalityExecutive.Report

      - name: Validate Desktop runtime evidence when present
        run: >-
          python -m hospitality_intelligence.validate_desktop_evidence
          --allow-missing

      - name: Generate dedicated forecasting horizon
        run: |
          python -m hospitality_intelligence.generate_synthetic_data \
            --output-dir data/forecast \
            --days 420 \
            --seed 42 \
            --anchor 2025-07-01T00:00:00+00:00 \
            --scenario healthy

      - name: Validate forecasting source contracts
        run: python -m hospitality_intelligence.validate_sources --data-dir data/forecast

      - name: Require predictive candidate to beat seasonal baseline
        run: |
          python -m hospitality_intelligence.forecasting \
            --data-dir data/forecast \
            --candidate hist_gradient_boosting \
            --output /tmp/forecast_metrics.json \
            --expect accepted

      - name: Prove weak forecast candidate is rejected
        run: |
          python -m hospitality_intelligence.forecasting \
            --data-dir data/forecast \
            --candidate zero \
            --expect rejected

      - name: Prove predictive acceptance is robust across seeds
        shell: bash
        run: |
          for seed in 7 107; do
            python -m hospitality_intelligence.generate_synthetic_data \
              --output-dir "data/forecast-${seed}" \
              --days 420 \
              --seed "${seed}" \
              --anchor 2025-07-01T00:00:00+00:00 \
              --scenario healthy
            python -m hospitality_intelligence.validate_sources \
              --data-dir "data/forecast-${seed}"
            python -m hospitality_intelligence.forecasting \
              --data-dir "data/forecast-${seed}" \
              --candidate hist_gradient_boosting \
              --expect accepted
          done


      - name: Build healthy management-opportunity model
        run: |
          python -m hospitality_intelligence.value_model \
            --data-dir data/benchmark/healthy \
            --output /tmp/value_healthy.json

      - name: Build leakage management-opportunity model
        run: |
          python -m hospitality_intelligence.value_model \
            --data-dir data/benchmark/leakage \
            --output /tmp/value_leakage.json

      - name: Prove opportunity model reacts to controlled leakage
        run: |
          python -m hospitality_intelligence.validate_value_model \
            --healthy /tmp/value_healthy.json \
            --leakage /tmp/value_leakage.json \
            --minimum-total-ratio 2.0
