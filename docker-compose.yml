services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hospitality
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: hospitality_intelligence
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hospitality_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitality -d hospitality_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hospitality_postgres:
