[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospitality-intelligence-platform"
version = "0.7.0"
description = "Synthetic hospitality decision-system flagship for Pretoria BI."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.9.1,<1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
